- route:
    id: query-inventory
    description: "Inventory Search"
    from:
      description: query-inventory
      uri: "direct:query-inventory"
      steps:
        - setVariable:
            description: "Save User Request"
            name: "userRequest"
            simple: "${body}"
        - setVariable:
            description: "Load Examples"
            name: "fewShotExamples"
            simple: "resource:classpath:few-shot-examples.txt"
        - setHeader:
            description: "Set Parser Instructions"
            name: "CamelOpenAISystemMessage"
            simple: >
              ### ROLE
              You are an Exhaustive Search Intent Parser. Your goal is to map the user's request
              into the provided JSON schema as completely as possible.

              ### CRITICAL RULES
              1. **Price Logic:**
                - "cheap", "budget" -> Set 'maxPrice' to 500.
                - "premium", "luxury" -> Set 'minPrice' to 1000.
                - "under X" -> Set 'maxPrice' to X.
              2. **Availability:** Set "inStockOnly": true ONLY if asked ("available", "in stock").

              ### FEW-SHOT EXAMPLES
              ${variable.fewShotExamples}

        - to:
            description: "Extract Search Intent"
            uri: "openai:chat-completion"
            parameters:
              temperature: 0.15
              jsonSchema: "resource:classpath:inventory-search.schema.json"
        - log:
            description: "Log Parsed Intent"
            message: "${body}"

        - unmarshal:
            description: "Unmarshal JSON"
            json:
              library: Jackson
              unmarshalType: "java.util.Map"
        - to:
            description: "Search Database"
            uri: "mybatis:searchItems?statementType=SelectList"
        - log:
            description: "Log DB Results"
            message: "${body}"

        - setVariable:
            description: "Save DB Results"
            name: "searchResults"
            simple: "${body}"
        - setBody:
            description: "Restore User Request"
            simple: "${variable.userRequest}"
        - setHeader:
            description: "Set Assistant Instructions"
            name: "CamelOpenAISystemMessage"
            simple: >
              You are a helpful Inventory Assistant.
              Answer the user's question using ONLY the search results below.

              RESULTS:
              ${variable.searchResults}
        - to:
            description: "Generate Final Answer"
            uri: "openai:chat-completion"

- route:
    id: console-adapter
    description: "Console Adapter"
    from:
      description: stream-in
      uri: stream:in
      steps:
        - to:
            description: query-inventory
            uri: direct:query-inventory
        - to:
            description: stream-out
            uri: stream:out
