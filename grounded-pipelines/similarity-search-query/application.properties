camel.jbang.dependencies=camel:openai,org.postgresql:postgresql:42.7.2,org.apache.commons:commons-dbcp2:2.9.0

camel.main.durationMaxIdleSeconds=5

# OpenAI Configuration
camel.component.openai.apiKey={{env:OPENAI_API_KEY}}
camel.component.openai.baseUrl={{env:OPENAI_BASE_URL}}
camel.component.openai.model={{env:OPENAI_MODEL}}

# Embedding model (nomic-embed-text, 768 dimensions)
camel.component.openai.embeddingModel={{env:OPENAI_EMBEDDING_MODEL:nomic-embed-text}}

# PostgreSQL Configuration
camel.beans.pgDataSource = #class:org.apache.commons.dbcp2.BasicDataSource
camel.beans.pgDataSource.driverClassName = org.postgresql.Driver
camel.beans.pgDataSource.url = jdbc:postgresql://localhost:5432/products
camel.beans.pgDataSource.username = postgres
camel.beans.pgDataSource.password = postgres
camel.component.sql.dataSource=#pgDataSource

# Similarity search settings
search.similarity.threshold=0.6
search.topK=5
