camel.jbang.dependencies=camel-ai-tool,camel-mcp-server

# Serve the MCP endpoint on the Camel main HTTP server (JBang wires this in).
# The camel-mcp-server Vert.x engine rides this port and serves /mcp by default.
camel.server.enabled=true
camel.server.port=8080
camel.server.mcp-enabled=true

# Publish ONLY routes tagged "commerce" as MCP tools. Untagged routes and other
# tags are never exposed — this is the server-side half of the tool boundary.
camel.server.mcp-tags=commerce

# This service must stay running to serve tools, so there is no idle timeout here.
