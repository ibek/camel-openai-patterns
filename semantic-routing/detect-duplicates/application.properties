camel.jbang.dependencies=camel-openai,io.kaoto.forage:forage-jdbc-postgresql:1.0

# Dependencies when exporting to Maven project via `camel export`
camel.jbang.dependencies.main=io.kaoto.forage:forage-jdbc:1.0
camel.jbang.dependencies.spring-boot=io.kaoto.forage:forage-jdbc-starter:1.0
camel.jbang.dependencies.quarkus=io.kaoto.forage:jdbc-camel-quarkus:1.0

camel.main.durationMaxIdleSeconds=5

# OpenAI Configuration
camel.component.openai.apiKey={{env:OPENAI_API_KEY}}
camel.component.openai.baseUrl={{env:OPENAI_BASE_URL}}
camel.component.openai.model={{env:OPENAI_MODEL}}

# Embedding model (nomic-embed-text, 768 dimensions)
camel.component.openai.embeddingModel={{env:OPENAI_EMBEDDING_MODEL:nomic-embed-text}}

# PostgreSQL Configuration
forage.jdbc.db.kind=postgresql
forage.jdbc.url=jdbc:postgresql://localhost:5432/tickets
forage.jdbc.username=postgres
forage.jdbc.password=postgres
camel.component.sql.dataSource=#dataSource

# Deduplication Settings
dedup.similarity.threshold=0.8
