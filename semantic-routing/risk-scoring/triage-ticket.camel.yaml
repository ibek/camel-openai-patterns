- route:
    id: triage-ticket
    description: "Risk Scoring"
    from:
      description: triage-ticket
      uri: "direct:triage-ticket"
      steps:
        - setVariable:
            description: "Load Rubric"
            name: "riskRubric"
            simple: "resource:classpath:risk-rubric.txt"
        - setHeader:
            description: "Set Prompt"
            name: "CamelOpenAISystemMessage"
            expression:
              simple: |
                You are a Security Operations Center AI.

                Task: Analyze the user's intent and assign the score and category based strictly on the provided rubric.

                ${variable.riskRubric}
        - to:
            description: "Score Ticket"
            uri: "openai:chat-completion"
            parameters:
              temperature: 0.15
              jsonSchema: "resource:classpath:ticket-risk.schema.json"

- route:
    id: console-adapter
    description: "Console Adapter"
    from:
      description: stream-in
      uri: stream:in
      steps:
        - to:
            description: triage-ticket
            uri: direct
            parameters:
              name: triage-ticket
        - to:
            description: stream-out
            uri: "stream:out"