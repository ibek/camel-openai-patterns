- route:
    id: pii-redaction
    description: "PII Redaction"
    from:
      description: pii-redaction
      uri: "direct:pii-redaction"
      steps:
        - to:
            description: "Redact Text"
            uri: "openai:chat-completion"
            parameters:
              temperature: 0.15
              jsonSchema: "resource:classpath:pii.schema.json"
              systemMessage: >
                You are a strict data privacy compliance assistant.
                Your goal is to analyze the user input, redact all PII, and return the results in the specified JSON format.

                RULES:
                1. ONLY redact specific identifiers
                2. DO NOT redact generic titles, roles, or common nouns unless they are part of a proper noun.
                3. Preserve the grammatical structure of the sentence.

- route:
    id: console-adapter
    description: "Console Adapter"
    from:
      description: stream-in
      uri: stream:in
      steps:
        - to:
            description: pii-redaction
            uri: direct:pii-redaction
        - to:
            description: stream-out
            uri: stream:out
