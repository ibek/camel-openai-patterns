# add camel.main.durationMaxIdleSeconds=5 to application.properties

- route:
    id: console-adapter
    description: "Console Adapter"
    from:
      description: stream-in
      uri: stream:in
      steps:
        - to:
            description: classify-leaf-node
            uri: direct:classify-leaf-node
        - to:
            description: stream-out
            uri: stream
            parameters:
              kind: out
